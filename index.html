:root{--ink:#0F1A2E;--paper:#F5F6F8;--blue:#2A44F5;--mist:#E1E5EE;--slate:#5B6578;--white:#fff;

.logo{font:800 22px var(--d);text-decoration:none;letter-spacing:-.02em}

.facts b{color:var(--ink);font-weight:700}
.chain{list-style:none;padding:0;position:relative}

.chain li:nth-child(n){margin-left:calc(var(--i)*14px)}
.chain li::before{content:"";position:absolute;left:-6px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.chain li:last-child{color:var(--blue);border-color:var(--blue)}
.chain li:last-child::before{background:var(--blue)}
.cap{font:500 14px var(--d);color:var(--slate);margin-top:16px}
#cours{background:var(--white);padding:72px 0 96px;border-top:1px solid var(--mist)}

.lead{color:var(--slate);margin-bottom:40px}
.player{display:grid;grid-template-columns:300px 1fr;gap:56px;align-items:start}
nav{position:sticky;top:20px}
.bar{height:6px;background:var(--mist);border-radius:6px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.pct{font:500 14px var(--d);color:var(--slate);margin-bottom:16px}
nav button{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;font:500 16px/1.3 var(--d);color:var(--slate);cursor:pointer}
nav button:hover{background:var(--paper)}
nav button[aria-current=true]{background:var(--ink);color:var(--white)}
nav .n{min-width:22px;font-weight:700}
nav .ok::after{content:"✓";margin-left:auto;color:var(--blue);font-weight:800}
nav button[aria-current=true].ok::after{color:var(--white)}
article{max-width:660px;min-height:480px}
article h3{font:800 clamp(28px,3.5vw,40px)/1.1 var(--d);letter-spacing:-.03em;margin-bottom:24px}
.mod{font:500 15px var(--d);color:var(--slate);margin-bottom:8px}
.key{font:700 clamp(20px,2.4vw,25px)/1.35 var(--d);border-left:4px solid var(--blue);padding-left:20px;margin-bottom:28px;letter-spacing:-.01em}
article ul{padding-left:1.1em;margin-bottom:28px}
article li{margin-bottom:10px}
article li::marker{color:var(--blue)}
.ex{background:var(--paper);border-radius:14px;padding:22px 24px;margin-bottom:32px}
.ex h4{font:700 17px var(--d);margin-bottom:6px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
footer{padding:40px 0;font:500 15px var(--d);color:var(--slate)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
#loader{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .6s ease,visibility .6s}
#loader.out{opacity:0;visibility:hidden}
#loader .lg{font:800 clamp(40px,9vw,84px) var(--d);letter-spacing:-.04em;color:var(--white);display:flex;overflow:hidden}
