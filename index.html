<style>
:root {
  --ink: #0F1A2E;
  --blue: #2A44F5;
  --blue-light: #8BA1FF;
  --white: #ffffff;
  --slate: #5B6578;
  --mist: #E1E5EE;
  --glass: rgba(255, 255, 255, 0.65);
  --glass-border: rgba(255, 255, 255, 0.6);
  --d: 'Bricolage Grotesque', system-ui, sans-serif;
  --s: 'Newsreader', Georgia, serif;
}

* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; }
body { 
  background-color: #F0F4FA; /* Fond très légèrement bleuté/blanc */
  color: var(--ink); 
  font: 400 19px/1.6 var(--s);
  position: relative;
  overflow-x: hidden;
}

/* --- ARRIÈRE-PLAN BLANC ET BLEU (Parallaxe au scroll) --- */
.ambient-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.blob {
  position: absolute; border-radius: 50%; filter: blur(100px);
  animation: float 20s infinite ease-in-out alternate; transition: transform 0.1s linear;
}
.blob.b1 { background: var(--blue-light); width: 45vw; height: 45vw; top: -10%; left: -10%; opacity: 0.4; }
.blob.b2 { background: var(--blue); width: 40vw; height: 40vw; bottom: 10%; right: -15%; opacity: 0.25; animation-delay: -5s; }
.blob.b3 { background: var(--white); width: 50vw; height: 50vw; top: 30%; left: 20%; opacity: 0.8; animation-duration: 25s; box-shadow: 0 0 100px var(--white); }

@keyframes float {
  0% { margin-top: 0; margin-left: 0; scale: 1; }
  50% { margin-top: 5vh; margin-left: 5vw; scale: 1.1; }
  100% { margin-top: -5vh; margin-left: -5vw; scale: 0.9; }
}

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
